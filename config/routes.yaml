# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# Sitemap — must be at root, no locale prefix (Google doesn't follow redirects)
sitemap:
    resource: ../src/Controller/SitemapController.php
    type: attribute

root:
    resource: ../src/Controller/RootController.php
    type: attribute

# Locale-aware routes (seule source de routes publiques)
locale_routes:
    resource: ../src/Controller/
    type: attribute
    prefix:
        fr: /fr
        en: /en
        nl: /nl
    requirements:
        _locale: 'fr|en|nl'
    exclude:
        - ../src/Controller/SitemapController.php
        - ../src/Controller/RootController.php
