# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        gc_maxlifetime: 1440

    # Rate limiting — actif après `composer require symfony/rate-limiter`
    rate_limiter:
        # Login : 5 tentatives par minute par IP
        login_throttle:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # Reset password : 3 tentatives par 30 min par IP
        password_reset:
            policy: fixed_window
            limit: 3
            interval: '30 minutes'
        # Contact form : 5 messages par heure par IP
        contact_form:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

    #esi: true
    #fragments: true

    # Désactiver le blocage des robots (Google, Facebook, etc.)
    disallow_search_engine_index: false

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
