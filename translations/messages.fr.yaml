# Homepage
home.title: "Ruelle d'Adem"
home.subtitle: "Transformons votre rue en un jardin florissant"
home.cta: "Combien de fleurs à 1€, de jardinières ou de palettes comptes-tu offrir ?"
home.offres: "Nos offres"
home.medias_intro: "Quelques images de la ruelle — le lieu du projet, tel qu'on le vit au quotidien."
home.offres_title: "Offres de soutien"
home.vip_title: "Formules V.I.P."
home.vip_subtitle: "Grâce à cette formule, tu peux personnaliser ta jardinière ou ta palette. De quoi épater tes amis lorsque tu leur fera visiter la ruelle d'Adem, ou lorsqu'il y découvriront ton nom."
home.don_libre_title: "Don libre"
home.don_libre_intro: "Tu peux aussi contribuer en offrant le montant de ton choix. Et, si telle est ton envie, nous pouvons afficher ton nom sur ce site."
home.gallery_title: "Galerie"
home.newsletter_title: "Restez informé"
home.newsletter_intro: "TU VEUX CONNAITRE LE NOMBRE DE FLEURS, DE JARDINIERES ET DE PALETTES OFFERTES?\nSavoir si un événement festif, récréatif ou éducatif se déroule dans la ruelle."
home.help_title: "ADEM DEMANDE TON AIDE"
home.help_content: "Cent mètres de ruelle à décorer, fleurir et entretenir, cela coûte. L'aide de ses parents, amis et le subside communal ne suffisent pas."
home.help_vip: "Voilà pourquoi Adem te propose d'offrir des bégonias, des jardinières ou des palettes à sa ruelle*. En formule V.I.P, tu peux même les personnaliser."
home.help_note: "Les indications Bégonias, jardinières et palettes (non VIP) sont donnés à titre indicatifs. Les fonds récoltés pouvant être utilisés pour l'achat d'autres fleurs et plantes ou pour la décoration et l'entretien de La Ruelle d'Adem."
home.piece: "pièce"
home.piece_plural: "pièces"

