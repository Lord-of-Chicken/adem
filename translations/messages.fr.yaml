# Homepage
home.title: "Ruelle d'Adem"
home.subtitle: "Un coin de rue qui attend tes fleurs"
home.cta: "Et toi, combien de bégonias à 1 €, de jardinières ou de palettes vas-tu offrir ?"
home.offres: "Nos offres"
home.medias_intro: "La ruelle en images — telle qu'elle est aujourd'hui. À toi de l'imaginer en fleurs !"
home.offres_title: "Offres de soutien"
home.vip_title: "Formules V.I.P."
home.vip_subtitle: "Ta jardinière, ta palette, ton nom — la formule V.I.P., c'est ton petit coin de ruelle à toi. De quoi épater tes amis lors de leur prochaine visite !"
home.don_libre_title: "Don libre"
home.don_libre_intro: "Tu choisis le montant, on s'occupe des fleurs. Et si tu veux, ton nom peut apparaître sur le site."
home.gallery_title: "Galerie"
home.newsletter_title: "Reste informé"
home.newsletter_intro: "TU VEUX CONNAÎTRE LE NOMBRE DE FLEURS, DE JARDINIÈRES ET DE PALETTES OFFERTES ?\nSavoir si un événement festif, récréatif ou éducatif se déroule dans la ruelle."
home.help_title: "ADEM DEMANDE TON AIDE"
home.help_content: "Fleurir, décorer et entretenir cent mètres de ruelle, ça ne s'improvise pas.\nL'entourage d'Adem et les subsides communaux ne couvrent pas tout."
home.help_vip: "C'est là qu'Adem a besoin de toi !\nOffre des bégonias, une jardinière ou une palette pour sa ruelle*. Et avec la formule V.I.P., tu peux même les personnaliser."
home.help_note: "* Les bégonias, jardinières et palettes sont donnés à titre indicatif. Les fonds collectés peuvent aussi servir à l'achat d'autres plantes ou à la décoration et l'entretien de la Ruelle d'Adem."
home.piece: "pièce"
home.piece_plural: "pièces"

