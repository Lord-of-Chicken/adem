legal.privacy.purposes_intro: "We process personal data for the following purposes:"
legal.privacy.purposes_account: "<strong>Account creation and management</strong> — enabling registration, authentication and access to your contribution history."
legal.privacy.purposes_newsletter: "<strong>Newsletter / mailing list</strong> — sending you information about the alley and its events, only after you sign up voluntarily."
legal.privacy.purposes_payment: "<strong>Payment and contributions</strong> — processing donations and purchases (begonias, planters, pallets) through our payment provider."
legal.privacy.purposes_contact: "<strong>Contact form</strong> — answering your questions and requests."
legal.privacy.purposes_gallery: "<strong>Photo gallery</strong> — displaying images of the alley; where applicable, VIP contributions show the name you provide us."
legal.privacy.purposes_analytics: "<strong>Audience measurement</strong> — understanding how the site is used (only with your consent to analytics cookies)."
legal.privacy.basis_contract: "<strong>Performance of a contract</strong> (GDPR art. 6.1.b) — account management, processing of payments and contributions."
legal.privacy.basis_consent: "<strong>Consent</strong> (GDPR art. 6.1.a) — newsletter, audience-measurement cookies, displaying your name for VIP contributions. Withdrawable at any time."
legal.privacy.basis_legal: "<strong>Legal obligation</strong> (GDPR art. 6.1.c) — retention of accounting records."
legal.privacy.basis_interest: "<strong>Legitimate interest</strong> (GDPR art. 6.1.f) — website security and fraud prevention."
legal.privacy.retention_invoicing: "<strong>Order / invoicing data</strong> — kept for <strong>7 years</strong> in accordance with the Belgian legal obligation to retain accounting records."
legal.privacy.retention_newsletter: "<strong>Newsletter</strong> — until you unsubscribe (unsubscribe link in every email)."
legal.privacy.retention_contact: "<strong>Contact form messages</strong> — <strong>6 months</strong> after your request has been handled."
legal.privacy.retention_account: "<strong>User account</strong> — for as long as the account is active; deleted on request."
legal.privacy.recipients_intro: "Your data is never sold. It may be shared with processors strictly necessary for the operation of the service:"
legal.privacy.recipients_stripe: "<strong>Stripe</strong> — payment provider. Payment processing may involve a <strong>transfer of data to the United States (USA)</strong>. This transfer is governed by a <strong>data processing agreement (DPA)</strong> and by the European Commission's <strong>standard contractual clauses (SCC)</strong>, ensuring an adequate level of protection."
legal.privacy.recipients_host_placeholder: "[TODO RGPD — HÉBERGEUR : nom et localisation des serveurs à compléter]"
legal.privacy.recipients_analytics: "<strong>Google Analytics</strong> — anonymised audience measurement, only after consent (see the cookie policy)."
legal.privacy.rights_intro: "Under the GDPR, you have the following rights over your data:"
legal.privacy.rights_access: "<strong>Right of access</strong> — obtain a copy of the data we hold about you."
legal.privacy.rights_rectification: "<strong>Right to rectification</strong> — correct inaccurate data."
legal.privacy.rights_erasure: "<strong>Right to erasure</strong> (“right to be forgotten”) — subject to legal retention obligations."
legal.privacy.rights_portability: "<strong>Right to portability</strong> — receive your data in a structured, readable format."
legal.privacy.rights_objection: "<strong>Right to object</strong> — object to processing based on legitimate interest."
legal.privacy.rights_withdraw: "<strong>Right to withdraw your consent</strong> — at any time, without affecting the lawfulness of prior processing."
legal.privacy.rights_exercise: "To exercise these rights, contact us:"
legal.privacy.rights_exercise_placeholder: "[TODO RGPD — CONTACT EXERCICE DES DROITS : adresse e-mail / postale à compléter]"
legal.privacy.rights_complaint: "You also have the right to lodge a complaint with the <strong>Data Protection Authority (APD / Gegevensbeschermingsautoriteit)</strong>, Rue de la Presse 35, 1000 Brussels —"

# Cookie policy
legal.cookies.title: "Cookie Policy"
legal.cookies.meta_description: "Cookie policy for Adem's Alley: cookie categories (essential, audience measurement, payment), durations and how to withdraw your consent."
legal.cookies.intro: "A cookie is a small file stored on your device. We sort cookies by category; only essential cookies are stored without your consent."
legal.cookies.essential_title: "Essential Cookies"
legal.cookies.essential_text: "Indispensable for the operation of the site and your security. They cannot be disabled."
legal.cookies.analytics_title: "Audience-Measurement Cookies"
legal.cookies.analytics_text: "They help us understand how the site is used. They are only stored after your explicit consent."
legal.cookies.payment_title: "Payment Cookies"
legal.cookies.payment_text: "Stored by Stripe during a payment, to secure the transaction and prevent fraud."
legal.cookies.revoke_title: "How to Withdraw Your Consent"
legal.cookies.revoke_text: "You can change or withdraw your consent at any time via the button below, or by deleting cookies in your browser settings."
legal.cookies.essential_session: "<strong>Session (PHPSESSID)</strong> — keeps your session (cart, authentication). Duration: session."
legal.cookies.essential_csrf: "<strong>CSRF token</strong> — protects forms against cross-site request forgery. Duration: session."
legal.cookies.essential_consent: "<strong>cookie_consent</strong> — remembers your cookie choice. Duration: 6 months."
legal.cookies.analytics_ga: "<strong>Google Analytics (_ga, _ga_*)</strong> — anonymised audience measurement (anonymize_ip enabled). Duration: up to 13 months. Loaded only after your consent."
legal.cookies.payment_stripe: "<strong>Stripe (__stripe_mid, __stripe_sid)</strong> — payment security and fraud prevention, set during a payment. Duration: up to 1 year."
