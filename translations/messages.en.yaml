home.help_content: "One hundred meters of alley to decorate, flower and maintain, this costs. Help from parents, friends and municipal subsidies is not enough."
home.help_vip: "That's why Adem offers you to offer begonias, planters or pallets to his alley*. In V.I.P formula, you can even personalize them."
home.help_note: "Begonias, planters and pallets indications (non VIP) are given for informational purposes only. The funds raised can be used for the purchase of other flowers and plants or for the decoration and maintenance of Adem's Alley."

