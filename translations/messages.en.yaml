# About
about.meta_description: "Discover the story of Adem, a young boy from Uccle who transformed his alley into a living garden, twice named Bruxellois de l'Année."
about.who_title: "WHO IS ADEM?"
about.section_2022_title: "2022. THE BIRTH OF ADEM'S ALLEY"
about.section_2022_text: |-
  Just seven years old and helped by his parents, Adem has fun. He decorates his front wall. He plants. Tinkers. Imagines. Creates. Paints. He builds birdhouses and feeders for the alley's many birds. As a result, he wins first prize in the "Uccle en Fleurs" contest. The local council magazine devotes an article to him. So does the "Tram 51" blog and others. The weekly "Le Vif" gives him a full page with the headline "As beautiful as Adem's alley." The "Chemin des Roses" is no more — make way for "Adem's Alley".
about.section_expo_title: "FIRST EXHIBITION"
about.section_expo_text: |-
  The artist Yorgo (Yorgoland) notices him. He admires the originality of these birdhouses built from "waste" — the various things Adem finds on the pavements or buys at flea markets. In September, Yorgo and the BrAMS collective invite Adem to exhibit alongside established artists. Pascal Bernier, Fabio Denker, JPMDR, Serge Vankerck, Didier Engels, Pascal Duquenne and Denis Meyers are among them. There he meets Elvis Pompilio, who invites him to visit his studio. Many artists buy a birdhouse from him. So do visitors. Everyone encourages him to keep going.
about.section_2023_title: "2023 EXTENDING THE ALLEY"
about.section_2023_text: |-
  Boosted by this encouragement, Adem is determined to extend his alley at any cost. At any cost indeed, because everything has a price. A grant application is submitted and approved. The thousand euros received barely cover half the costs. Never mind. The work goes on. Dad sands and Mum plants. The toys Adem has outgrown are put to use and turned into birdhouses — which will later lead him to say "My alley is a bit like my whole life." By the end of autumn, the alley has grown by thirty metres.
about.section_expos_title: "THE EXHIBITIONS"
about.section_expos_text: |-
  "Meet my Arts - Artists' Trail - Uccle" draws many visitors and makes the alley popular. Given the amazement he sparks, Adem is once again invited to a BrAMS collective exhibition. His banana-themed birdhouses do not go unnoticed and take their place beside works by Didier Plash, Lou Van T Riet, Jean Pol Lejeune, Stéphane Sola and many others. Once again, Adem's birdhouses sell like hot cakes. The artists are fans. Motivated. Fired up and encouraged by the locals, Adem is more determined than ever to keep going on his path — sorry, his alley.
about.section_2024_title: "2024 AN INSANE CHALLENGE"
about.section_2024_text: |-
  No more exhibitions. Time to spend. Together with his financiers — sorry, his parents — Adem wants to win his challenge. He wants to extend his alley from rue de la Fauvette all the way to chaussée d'Alsemberg. Around a hundred metres. The grant is spent. So are the proceeds from selling his birdhouses. He needs to buy or find dozens of pallets, planters and hundreds of flowers. He also needs new machines and a more efficient watering system. Buying everything is impossible. He has to improvise, yet the alley is becoming industrialised. The press takes more and more interest in this little phenomenon. That is just as stimulating as the passers-by and visitors who stroll there, marvelling at the calm and charm it gives off. Some remember that not so long ago the alley was infested with crack smokers, since horrified to admit that their own peace and quiet did not sit well with the appearance of passers-by, walkers, families, the curious, and groups of children brought there by a school or another organisation. By the end of summer the insane bet is nearly won, the alley is "cleaned up" and runs the entire length of the Chemin des Roses. But there is still work to do.
about.section_2025_title: |-
  2025 - ADEM, TWICE NAMED "BRUSSELS RESIDENT OF THE YEAR"
about.section_2025_text: |-
  There was still work to do. So it goes on. Helped more than ever by his parents, Adem creates more birdhouses. More decorations. He fine-tunes. He welcomes journalists. And suddenly, to everyone's astonishment, the verdict comes. Adem is named "Brussels Resident of the Year". Barely recovered from the emotion and media buzz this honour brings, the Dutch-speaking outlet "BRUZZ" in turn declares him "Brusselaar van het jaar". And, so the media year ends like a Christmas tale, the VRT invites Adem to take part in the "Vrede op Aarde" programme broadcast on Christmas Day. There he receives the show's prize.
about.section_2026_title: "2026"
about.section_2026_text1: "Adem exhibits the new birdhouses, this time brightly coloured, alongside Yorgo and Elvis Pompilio (whom he considers his artistic mentors) at Fashion'Art (Dour-Mons)."
about.section_2026_text2: "The new grant requested from the council is approved; its amount is quickly swallowed up buying materials, pots, plants and above all a makeover that will make the alley more attractive and green in winter."
about.section_2026_text3: |-
  But Adem's passions have changed. Gone are the Minions and the Pokémon. Now they decorate his birdhouses, just like his Star Wars collection. Make way for Nintendo and PlayStation. Make way for other artistic flights of fancy. Adem dreams bigger; he imagines themed sets. "Les Rézaux Zoziaux", "Nature in the City", "The Royal Birdhouses" (built from the trinkets and keepsakes of his late grandfather) and other ideas he will exhibit this summer.
about.section_cta_title: "OUT OF THE GOODNESS OF YOUR HEART, LADIES AND GENTLEMEN... DO ADEM A FAVOUR!"
about.section_cta_text: "Adem now has to buy flowers. Lots of flowers. Hundreds of begonias, dozens of geraniums and other varieties. Set up more pallets. Water with more professional equipment. Make sure the alley's beauty lasts. Perhaps even spark the creation of other alleys elsewhere. One can dream. Adem loves to dream. He is counting on you to make his dreams come true. Do Adem a favour."

# FAQ
faq.title: "FAQ - Frequently Asked Questions"
faq.meta_description: "Find answers to the most frequently asked questions about the Ruelle d'Adem project: participation, fund usage, and more."
faq.q1.question: "How can I take part in the project?"
faq.q1.answer: "From the homepage, choose what you want to offer — begonias, a planter or a pallet — and add it to your cart. Every contribution, big or small, counts!"
faq.q2.question: "Where does the collected money go?"
faq.q2.answer: "100% of the funds go directly to the project: buying flowers, planters, pallets and maintaining the alley. We're committed to being transparent about every euro spent."
faq.q3.question: "Can I personalise my contribution?"
faq.q3.answer: "Yes! With a V.I.P. formula, you choose what's written on your planter or pallet. Your name — or whoever you choose — will be displayed on the site as a thank you."
faq.q4.question: "Where do the flowers go?"
faq.q4.answer: "Flowers and planters are installed directly in la Ruelle d'Adem. You can come see them in person — and show everyone what you offered!"
faq.q5.question: "Is the project secure?"
faq.q5.answer: "Yes, payments are secured via Stripe. We don't store any banking information and all transactions are encrypted."
faq.q6.question: "WHY BEGONIAS?"
faq.q6.answer: "Of all the flowers Adem has planted, the begonias are the ones that held up best. And above all, the begonias are the ones that gave his alley the most colour. A real treat for the eyes, where the begonia(s) you have given will take pride of place in good company."

