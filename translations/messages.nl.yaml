# About
about.meta_description: "Ontdek het verhaal van Adem, een jongen uit Ukkel die zijn steegje omtoverde tot een levende tuin en tweemaal Bruxellois de l'Année werd."
about.who_title: "WIE IS ADEM?"
about.section_2022_title: "2022. DE GEBOORTE VAN ADEMS STEEGJE"
about.section_2022_text: |-
  Amper zeven jaar oud en geholpen door zijn ouders, vermaakt Adem zich. Hij versiert zijn gevel. Hij plant. Knutselt. Verzint. Creëert. Schildert. Hij maakt nestkastjes en voederbakjes voor de vele vogels in het steegje. Het resultaat: hij wint een eerste prijs in de wedstrijd "Uccle en Fleurs". Het gemeenteblad wijdt een artikel aan hem. De blog "Tram 51" en andere ook. Het weekblad "Le Vif" geeft hem een volledige pagina met als titel "Zo mooi als het steegje van Adem.". Het is gedaan met de "Chemin des Roses", plaats voor "Het steegje van Adem".
about.section_expo_title: "EERSTE TENTOONSTELLING"
about.section_expo_text: |-
  De kunstenaar Yorgo (Yorgoland) merkt hem op. Hij waardeert de originaliteit van die nestkastjes, gemaakt van "afval" — allerlei dingen die Adem op de stoep vindt of op rommelmarkten koopt. In september nodigen Yorgo en het collectief BrAMS Adem uit om te exposeren naast gevestigde kunstenaars. Pascal Bernier, Fabio Denker, JPMDR, Serge Vankerck, Didier Engels, Pascal Duquenne en Denis Meyers zijn van de partij. Daar ontmoet hij Elvis Pompilio, die hem uitnodigt om zijn atelier te bezoeken. Veel kunstenaars kopen een nestkastje van hem. Bezoekers ook. Iedereen moedigt hem aan om door te zetten.
about.section_2023_title: "2023 VERLENGING VAN HET STEEGJE"
about.section_2023_text: |-
  Gesterkt door deze aanmoedigingen wil Adem zijn steegje koste wat het kost verlengen. Koste wat het kost, want alles heeft een prijs. Een subsidieaanvraag wordt ingediend en goedgekeurd. De ontvangen duizend euro dekt amper de helft van de kosten. Het maakt niet uit. Men verlengt. Papa schuurt en mama plant bloemen. Het speelgoed waar Adem niet meer in geïnteresseerd is, wordt ingezet en omgetoverd tot nestkastjes. Wat hem later zal doen zeggen: "Mijn steegje, dat is een beetje mijn hele leven." Tegen het einde van de herfst is het steegje dertig meter langer geworden.
about.section_expos_title: "DE TENTOONSTELLINGEN"
about.section_expos_text: |-
  "Meet my Arts - Kunstenaarsparcours - Ukkel" trekt veel bezoekers en maakt het steegje populair. Gezien de verbazing die hij wekt, wordt Adem opnieuw uitgenodigd voor een tentoonstelling van het collectief BrAMS. Zijn nestkastjes met bananenthema blijven niet onopgemerkt en krijgen een plaats naast de werken van Didier Plash, Lou Van T Riet, Jean Pol Lejeune, Stéphane Sola en zovele anderen. Opnieuw gaan Adems nestkastjes als warme broodjes over de toonbank. De kunstenaars zijn er fan van. Gemotiveerd. Vol goede moed en aangemoedigd door de buurtbewoners is Adem vastberadener dan ooit om zijn weg — pardon, zijn steegje — voort te zetten.
about.section_2024_title: "2024 EEN WAANZINNIGE UITDAGING"
about.section_2024_text: |-
  Gedaan met de tentoonstellingen. Tijd om uit te geven. Samen met zijn financiers — pardon, zijn ouders — wil Adem zijn uitdaging winnen. Hij wil zijn steegje uitbreiden van de rue de la Fauvette tot aan de chaussée d'Alsemberg. Zo'n honderd meter. De subsidie is uitgegeven. De opbrengst van de verkoop van zijn nestkastjes ook. Hij moet tientallen paletten, bloembakken en honderden bloemen kopen of vinden. Hij heeft ook nieuwe machines nodig en een beter besproeiingssysteem. Alles kopen is onmogelijk. Hij moet knutselen, maar het steegje industrialiseert. De pers raakt steeds meer geïnteresseerd in dit kleine fenomeen. Dat stimuleert net zozeer als de voorbijgangers en bezoekers die er rondslenteren, verwonderd over de rust en de charme die het uitstraalt. Sommigen herinneren zich dat het steegje nog niet zo lang geleden vergeven was van crackrokers, sindsdien met afgrijzen toegevend dat hun eigen rust slecht samenging met het verschijnen van voorbijgangers, wandelaars, gezinnen, nieuwsgierigen en groepen kinderen die er door een school of een andere organisatie naartoe werden gebracht. Tegen het einde van de zomer is de waanzinnige weddenschap zo goed als gewonnen, het steegje is "opgeruimd" en loopt over de hele lengte van de Chemin des Roses. Maar er is nog werk aan de winkel.
about.section_2025_title: |-
  2025 - ADEM, TWEEMAAL VERKOZEN TOT "BRUSSELAAR VAN HET JAAR"
about.section_2025_text: |-
  Er was nog werk aan de winkel. Dus gaat het verder. Meer dan ooit geholpen door zijn ouders maakt Adem nog meer nestkastjes. Nog meer decoraties. Hij verfijnt. Hij ontvangt journalisten. En plots, tot ieders verbazing, valt het oordeel. Adem wordt verkozen tot "Brusselaar van het Jaar". Amper bekomen van de emoties en de mediahype rond deze onderscheiding, roept het Nederlandstalige medium "BRUZZ" hem op zijn beurt uit tot "Brusselaar van het jaar". En, alsof het mediajaar als een kerstverhaal moest eindigen, nodigt de VRT Adem uit om deel te nemen aan het programma "Vrede op Aarde" dat op kerstdag wordt uitgezonden. Daar ontvangt hij de prijs van het programma.
about.section_2026_title: "2026"
about.section_2026_text1: "Adem stelt de nieuwe nestkastjes tentoon, dit keer felgekleurd, samen met Yorgo en Elvis Pompilio (die hij als zijn artistieke peters beschouwt) op Fashion'Art (Dour-Mons)."
about.section_2026_text2: "De nieuwe subsidie die aan de gemeente werd gevraagd, is toegekend; het bedrag verdwijnt al snel in de aankoop van materiaal, potten, planten en vooral een make-over die het steegje aantrekkelijker en groener zal maken in de winter."
about.section_2026_text3: |-
  Maar Adems passies zijn veranderd. Gedaan met de Minions en de Pokémon. Nu sieren ze zijn nestkastjes, net als zijn Star Wars-collectie. Plaats voor Nintendo en PlayStation. Plaats voor andere artistieke fantasieën. Adem droomt groter; hij verzint themareeksen. "Les Rézaux Zoziaux", "Natuur in de stad", "De Koninklijke Nestkastjes" (gemaakt van de prullaria en souvenirs van zijn overleden grootvader) en andere ideeën die hij deze zomer zal tentoonstellen.
about.section_cta_title: "UIT DE GOEDHEID VAN UW HART, DAMES EN HEREN... DOE ADEM EEN PLEZIER!"
about.section_cta_text: "Adem moet nu bloemen kopen. Veel bloemen. Honderden begonia's, tientallen geraniums en andere soorten. Nog meer paletten plaatsen. Besproeien met professioneler materiaal. Ervoor zorgen dat de schoonheid van het steegje blijft duren. Misschien zelfs de aanzet geven tot andere steegjes elders. Dromen mag. Adem droomt graag. Hij rekent op jou om zijn dromen waar te maken. Doe Adem een plezier."

# FAQ
faq.title: "FAQ - Veelgestelde vragen"
faq.meta_description: "Vind antwoorden op de meest gestelde vragen over het project Ruelle d'Adem: deelname, gebruik van middelen en meer."
faq.q1.question: "Hoe kan ik deelnemen aan het project?"
faq.q1.answer: "Kies op de startpagina wat je wil aanbieden — begonia's, een bloembak of een pallet — en voeg het toe aan je winkelwagen. Elke bijdrage, groot of klein, telt!"
faq.q2.question: "Waar gaat het ingezamelde geld naartoe?"
faq.q2.answer: "100% van de middelen gaat rechtstreeks naar het project: aankoop van bloemen, bloembakken, pallets en onderhoud van het steegje. We beloven transparant te zijn over elke bestede euro."
faq.q3.question: "Kan ik mijn bijdrage personaliseren?"
faq.q3.answer: "Ja! Met een V.I.P.-formule kies je wat er op je bloembak of pallet staat. Jouw naam — of die van jouw keuze — wordt op de site vermeld als dankbetuiging."
faq.q4.question: "Waar gaan de bloemen naartoe?"
faq.q4.answer: "Bloemen en bloembakken worden rechtstreeks in la Ruelle d'Adem geplaatst. Je kunt ze komen bewonderen — en aan iedereen laten zien wat jij hebt aangeboden!"
faq.q5.question: "Is het project veilig?"
faq.q5.answer: "Ja, betalingen zijn beveiligd via Stripe. We slaan geen bankgegevens op en alle transacties zijn versleuteld."
faq.q6.question: "WAAROM BEGONIA'S?"
faq.q6.answer: "Van alle bloemen die Adem heeft geplant, hebben de begonia's het het best gehouden. En vooral: het zijn de begonia's die zijn steegje het meeste kleur hebben gegeven. Een echte lust voor het oog, waar de begonia('s) die jij hebt geschonken in goed gezelschap zullen pronken."

