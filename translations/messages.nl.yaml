# Cookiebeleid
legal.cookies.title: "Cookiebeleid"
legal.cookies.meta_description: "Cookiebeleid van het Steegje van Adem: cookiecategorieën (essentieel, publieksmeting, betaling), duur en hoe je je toestemming intrekt."
legal.cookies.intro: "Een cookie is een klein bestand dat op je apparaat wordt geplaatst. We delen cookies in per categorie; alleen essentiële cookies worden zonder je toestemming geplaatst."
legal.cookies.essential_title: "Essentiële cookies"
legal.cookies.essential_text: "Onmisbaar voor de werking van de site en je veiligheid. Ze kunnen niet worden uitgeschakeld."
legal.cookies.analytics_title: "Cookies voor publieksmeting"
legal.cookies.analytics_text: "Ze helpen ons begrijpen hoe de site wordt gebruikt. Ze worden pas geplaatst na je uitdrukkelijke toestemming."
legal.cookies.payment_title: "Betalingscookies"
legal.cookies.payment_text: "Geplaatst door Stripe tijdens een betaling, om de transactie te beveiligen en fraude te voorkomen."
legal.cookies.revoke_title: "Hoe trek je je toestemming in"
legal.cookies.revoke_text: "Je kunt je toestemming op elk moment wijzigen of intrekken via de knop hieronder, of door cookies te verwijderen in de instellingen van je browser."
