legal.cookies.essential_csrf: "<strong>CSRF-token</strong> — bescherming van formulieren tegen cross-site request forgery. Duur: sessie."
legal.cookies.essential_consent: "<strong>cookie_consent</strong> — onthoudt je cookiekeuze. Duur: 6 maanden."
legal.cookies.analytics_ga: "<strong>Google Analytics (_ga, _ga_*)</strong> — geanonimiseerde publieksmeting (anonymize_ip ingeschakeld). Duur: tot 13 maanden. Alleen geladen na je toestemming."
legal.cookies.payment_stripe: "<strong>Stripe (__stripe_mid, __stripe_sid)</strong> — beveiliging van de betaling en fraudepreventie, geplaatst tijdens een betaling. Duur: tot 1 jaar."
