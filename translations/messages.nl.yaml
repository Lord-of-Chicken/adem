# About
about.coming_soon: "Inhoud binnenkort beschikbaar..."
about.meta_description: "Ontdek het project Ruelle d'Adem: onze missie, transparantie en hoe we middelen gebruiken om de straat in een bloeiende tuin te veranderen."
about.project_title: "Het Project"
about.project_description: "La Ruelle d'Adem is een stedelijk transformatieproject gericht op de verfraaiing van onze wijk door een groene en gastvrije ruimte te creëren. Honderd meter steeg om te versieren, te beplanten en te onderhouden ten bate van iedereen."
about.mission_title: "Onze Missie"
about.mission_description: "Een gewone stedelijke ruimte omvormen tot een plek van leven, delen en schoonheid. Wij geloven dat elke geplante bloem een gebaar van hoop en gemeenschap is."
about.transparency_title: "Transparantie"
about.transparency_description: "Wij verbinden ons tot volledige transparantie over het gebruik van de ingezamelde middelen. Elke bijdrage zal worden gebruikt voor de aankoop van bloemen, bloembakken, pallets en het onderhoud van het steegje."
about.contact_title: "Contact"
about.contact_description: "Voor vragen over het project kunt u contact met ons opnemen via het contactformulier op de site."

# FAQ
faq.title: "FAQ - Veelgestelde vragen"
faq.meta_description: "Vind antwoorden op de meest gestelde vragen over het project Ruelle d'Adem: deelname, gebruik van middelen, levering en meer."
faq.q1.question: "Hoe kan ik deelnemen aan het project?"
faq.q1.answer: "U kunt deelnemen door bloemen, bloembakken of pallets te schenken via onze startpagina. Elke bijdrage helpt het steegje om te vormen tot een groene en gastvrije ruimte."
faq.q2.question: "Waar gaat het ingezamelde geld naartoe?"
faq.q2.answer: "100% van de ingezamelde middelen wordt gebruikt voor de aankoop van bloemen, bloembakken, pallets en het onderhoud van het steegje. Wij verbinden ons tot volledige transparantie over het gebruik van de middelen."
faq.q3.question: "Kan ik mijn bijdrage personaliseren?"
faq.q3.answer: "Ja! Met onze V.I.P. formules kunt u uw bloembak of pallet personaliseren. Uw naam wordt op de site vermeld als dank voor uw steun."
faq.q4.question: "Hoe ontvang ik mijn bloemen?"
faq.q4.answer: "Bloemen en bloembakken worden rechtstreeks in la Ruelle d'Adem geplaatst. U kunt ze komen bewonderen en uw bijdrage in de praktijk zien."
faq.q5.question: "Is het project veilig?"
faq.q5.answer: "Ja, betalingen zijn beveiligd via Stripe. Wij slaan geen bankgegevens op en alle transacties zijn versleuteld."

