home.newsletter_intro: "WILT U HET AANTAL BLOEMEN, BLOEMBAKKEN EN PALLETS KENNEN?\nWeet of er een feestelijk, recreatief of educatief evenement plaatsvindt in het steegje."
home.help_title: "ADEM HEEFT UW HULP NODIG"
home.help_content: "Honderd meter steeg om te versieren, te beplanten en te onderhouden, dat kost geld. Hulp van ouders, vrienden en gemeentelijke subsidies is niet genoeg."
home.help_vip: "Daarom biedt Adem u de mogelijkheid om begonia's, bloembakken of pallets voor la Ruelle d'Adem te schenken*. In V.I.P. formule kunt u ze zelfs personaliseren."
home.help_note: "De aanduidingen van begonia's, bloembakken en pallets (niet-VIP) zijn uitsluitend informatief. De ingezamelde middelen kunnen worden gebruikt voor de aankoop van andere bloemen en planten of voor de decoratie en het onderhoud van la Ruelle d'Adem."
