; Activer l'affichage des erreurs (UNIQUEMENT pour debug temporaire)
display_errors = on
display_startup_errors = Off

; Logger les erreurs dans un fichier
log_errors = On
error_log = /home/ruellen/logs/php_errors.log

; Niveau de reporting
error_reporting = E_ALL

; Taille max du log
log_errors_max_len = 1024