; Ne JAMAIS afficher les erreurs en production (fuite d'informations sensibles).
display_errors = Off
display_startup_errors = Off

; Logger les erreurs dans un fichier
log_errors = On
error_log = /home/ruellen/logs/php_errors.log

; Niveau de reporting
error_reporting = E_ALL

; Taille max du log
log_errors_max_len = 1024

; Durcissement supplémentaire
expose_php = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1