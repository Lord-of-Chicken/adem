name: Préparation serveur OVH (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
      SSH_USER: ${{ secrets.OVH_SSH_USER }}
      SSH_PORT: ${{ secrets.OVH_SSH_PORT || '22' }}
      REMOTE_PATH: ${{ secrets.OVH_PATH }}
    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Créer le dossier et copier la config (sans rien supprimer ni écraser)
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
          set -e
          T="$1"
          HOME_P="$(cd ~ && pwd -P)"
          echo "Home : $HOME_P"
          echo "Cible : $T"
          if [ "$T" = "$HOME_P" ] || [ "$T" = "$HOME_P/" ]; then echo "::error::OVH_PATH = home"; exit 1; fi
          mkdir -p "$T"
          echo "--- Contenu du home (noms seulement) :"; ls -A ~
          for f in .env.local .ovhconfig; do
            if [ -e "$T/$f" ]; then echo "$f : déjà présent dans la cible, inchangé"; continue; fi
            src=""
            for d in "$HOME_P" "$HOME_P/www" "$HOME_P/www/adem"; do
              if [ -f "$d/$f" ]; then src="$d/$f"; break; fi
            done
            if [ -n "$src" ]; then cp -p "$src" "$T/$f"; echo "$f : copié depuis $src (original conservé)"; else echo "$f : introuvable dans ~, ~/www"; fi
          done
          if [ ! -e "$T/.ovhconfig" ]; then
            printf 'app.engine=php\napp.engine.version=8.4\nhttp.firewall=none\nenvironment=production\ncontainer.image=stable64\n' > "$T/.ovhconfig"
            echo ".ovhconfig : créé (PHP 8.4, production)"
          fi
          echo "--- .ovhconfig :"; cat "$T/.ovhconfig"
          if [ -f "$T/.env.local" ]; then
            echo "--- Variables définies dans .env.local (noms seulement) :"
            grep -E '^[A-Z_]+=' "$T/.env.local" | cut -d= -f1 | sort
            grep -qE '^APP_ENV=prod' "$T/.env.local" && echo "APP_ENV=prod : OK" || echo "::warning::APP_ENV n'est pas prod"
          fi
          echo "--- Cible :"; ls -A "$T"
          EOF

      - name: Inspecter et sauvegarder l'ancien site (lecture + archive, rien supprimé)
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
          set -eo pipefail
          cd ~
          echo "--- www (noms) :"; ls -A www | head -50
          [ -d www/public ] && { echo "--- www/public :"; ls -A www/public | head -30; }
          echo "--- Taille www :"; du -sh www
          for f in ~/.env www/.env www/.env.local www/.env.local.php www/.env.prod; do
            [ -f "$f" ] && { echo "--- Variables de $f (noms) :"; grep -E '^[A-Z_]+=' "$f" | cut -d= -f1 | sort | tr '\n' ' '; echo; grep -E '^APP_ENV=' "$f" || true; }
          done
          ls ~/backup-www-*.tar.gz >/dev/null 2>&1 || { B=~/backup-www-$(date +%Y%m%d-%H%M%S).tar.gz; tar -czf "$B" www; echo "Sauvegarde : $B"; }
          ls -1 ~/backup-* 2>/dev/null
          # .env.local de la nouvelle appli = .env prod de l'ancien site (si absent)
          T="$1"
          if [ ! -e "$T/.env.local" ] && grep -qE '^APP_ENV=prod' www/.env; then
            cp -p www/.env "$T/.env.local"; chmod 600 "$T/.env.local"; echo ".env.local : créé depuis www/.env (prod)"
          fi
          # Sauvegarde BDD avant migrations
          eval "$(php -r '$e=[];foreach(file($argv[1])as$l){if(preg_match("/^DATABASE_URL=\"?([^\"\n]*)/",$l,$m))$u=$m[1];}$p=parse_url($u);printf("DBH=%s DBP=%s DBU=%s DBN=%s DBW=%s\n",escapeshellarg($p["host"]),escapeshellarg($p["port"]??3306),escapeshellarg(urldecode($p["user"])),escapeshellarg(ltrim($p["path"],"/")),escapeshellarg(urldecode($p["pass"]??"")));' "$T/.env.local")"
          D=~/backup-db-$(date +%Y%m%d-%H%M%S).sql.gz
          MYSQL_PWD="$DBW" mysqldump -h "$DBH" -P "$DBP" -u "$DBU" --single-transaction --no-tablespaces "$DBN" | gzip > "$D"
          echo "Sauvegarde BDD : $D ($(du -h "$D" | cut -f1))"
          EOF

      - name: Diagnostic BDD (lecture seule)
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
          cd "$1"
          PHP=/usr/local/php8.4/bin/php; [ -x "$PHP" ] || PHP=php
          echo "--- Sauvegardes :"; ls -l ~/backup-* ; for f in ~/backup-db-*.sql.gz; do echo "$f"; zcat "$f" | head -c 600; echo; zcat "$f" | grep -c "CREATE TABLE" || true; done
          echo "--- migrations:status"; APP_ENV=prod $PHP bin/console doctrine:migrations:status --env=prod --no-debug -q 2>&1 | grep -vE '^\{' | tail -30
          echo "--- migrations:list"; APP_ENV=prod $PHP bin/console doctrine:migrations:list --env=prod --no-debug 2>&1 | grep -vE '^\{' | tail -60
          echo "--- schema diff (SQL qui serait exécuté, non appliqué)"; APP_ENV=prod $PHP bin/console doctrine:schema:update --dump-sql --env=prod --no-debug 2>&1 | grep -vE '^\{' | tail -60
          EOF

      - name: Marquer la migration reset_token comme appliquée (colonnes déjà présentes)
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
          cd "$1"
          PHP=/usr/local/php8.4/bin/php; [ -x "$PHP" ] || PHP=php
          APP_ENV=prod $PHP bin/console doctrine:migrations:version 'DoctrineMigrations\Version20260510125840' --add --no-interaction --env=prod --no-debug 2>&1 | grep -vE '^\{' | tail -5 || true
          EOF

      - name: Vérifier le site (HTTP + logs prod)
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
          cd "$1"
          U=$(grep -E '^DEFAULT_URI=' .env.local | cut -d= -f2- | tr -d '"')
          echo "DEFAULT_URI : $U"
          for p in / /fr /fr/faq; do echo "$p -> $(curl -s -o /dev/null -w '%{http_code} %{time_total}s' -L "${U%/}$p")"; done
          echo "--- prod.log (dernières erreurs) :"; [ -f var/log/prod.log ] && grep -E 'ERROR|CRITICAL' var/log/prod.log | tail -15 | cut -c1-300 || echo "pas de prod.log"
          EOF

      - name: Diagnostic assets/images + reprise des médias de l'ancien site
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
          cd "$1"
          U=$(grep -E '^DEFAULT_URI=' .env.local | cut -d= -f2- | tr -d '"'); U=${U%/}
          echo "--- Fichiers de www/public absents de adem/public :"
          (cd ~/www/public && find . -type f ! -path './assets/*' ! -path './bundles/*') | while read f; do [ -e "public/$f" ] || echo "$f"; done | head -40
          echo "(total : $( (cd ~/www/public && find . -type f ! -path './assets/*' ! -path './bundles/*') | while read f; do [ -e "public/$f" ] || echo x; done | wc -l))"
          echo "--- Ressources de la home :"
          curl -s "$U/fr" > /tmp/home.html
          grep -oE '(src|href)="/[^"]+"' /tmp/home.html | cut -d'"' -f2 | sort -u | grep -vE '^/(fr|en|nl)(/|$)' | head -40 | while read r; do echo "$(curl -s -o /dev/null -w '%{http_code}' "$U$r") $r"; done
          ls public/assets | head -5; echo "assets compilés : $(find public/assets -type f | wc -l)"
          echo "--- Reprise des médias (sans écraser) :"
          rsync -a --ignore-existing --itemize-changes ~/www/public/img/ public/img/ | grep -c '^>f' || true
          EOF

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/id_ed25519
